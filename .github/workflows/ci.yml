name: CI Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install dependencies
      run: npm install

    - name: Type check
      run: npm run lint

    - name: Build
      run: npm run build

    - name: Run unit and integration tests
      run: npm test
      env:
        NODE_ENV: test
        VAULT_MASTER_KEY: c3VwZXJzZWNyZXR2YXVsdG1hc3RlcmtleW1hc3RlcmtleQ==
        SESSION_SECRET: somesessionsecretthatisatleastthirtytwobyteslong
